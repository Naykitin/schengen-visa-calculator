    <polygon points="0,-35 2,-29 8,-29 3,-25 5,-19 0,-23 -5,-19 -3,-25 -8,-29 -2,-29" transform="rotate(330)"/>
    <!-- Center passport / badge badge -->
    <circle cx="0" cy="0" r="16" fill="#0b0f19" opacity="0.9" />
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="13" fill="#38bdf8" text-anchor="middle">90</text>
