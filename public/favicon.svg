    <polygon points="0,-35 2,-29 8,-29 3,-25 5,-19 0,-23 -5,-19 -3,-25 -8,-29 -2,-29" transform="rotate(120)"/>
    <polygon points="0,-35 2,-29 8,-29 3,-25 5,-19 0,-23 -5,-19 -3,-25 -8,-29 -2,-29" transform="rotate(150)"/>
    <polygon points="0,-35 2,-29 8,-29 3,-25 5,-19 0,-23 -5,-19 -3,-25 -8,-29 -2,-29" transform="rotate(180)"/>
